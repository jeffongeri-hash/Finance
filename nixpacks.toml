[phases.setup]
nixPkgs = ["python311", "python311Packages.pip"]

[phases.install]
cmds = [
  # Install core deps first (nasdaq-data-link has an optional C extension that
  # may fail on some platforms; the app degrades gracefully without it)
  "pip install --upgrade pip",
  "pip install fastapi 'uvicorn[standard]' httpx pandas numpy python-dotenv pydantic pydantic-settings aiohttp websockets fredapi finnhub-python colorama tabulate python-dateutil",
  "pip install 'yfinance==0.2.50' --no-deps",
  "pip install requests multitasking lxml beautifulsoup4 html5lib || true",
  "pip install nasdaq-data-link || true",
  "pip install 'py-clob-client>=0.16.0' || true",
  "pip install langchain langgraph langchain-core langchain-openai langchain-anthropic langchain-groq || true",
]

[start]
cmd = "cd market-catalyst-tracker/backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
